name: Validate production image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: migration-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag sms2-production-ci .

      - name: Verify required migration files are packaged
        run: |
          docker run --rm --entrypoint sh sms2-production-ci -c \
            'test -r /var/www/html/database/sms2_db.sql && \
             test -r /var/www/html/modules/crad/database/crad_db.sql'

      - name: Verify imports, preserved accounts and repeat migrations
        run: |
          docker run --rm --network host \
            -e SMS2_MIGRATION_TEST_HOST=127.0.0.1 \
            -e SMS2_MIGRATION_TEST_PASSWORD=migration-ci-only \
            sms2-production-ci php /var/www/html/tests/deployment_migration_test.php
